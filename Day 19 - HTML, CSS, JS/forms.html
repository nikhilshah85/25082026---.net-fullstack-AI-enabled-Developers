<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration</title>
</head>
<body>
    <form>
    <table border="1">
       <tr>
            <td> First Name  </td>
            <td> <input type="text" placeholder="Please Enter Your First Name"/> </td>
       </tr>
        <tr>
            <td> Last Name  </td>
            <td> <input type="text" placeholder="Please enter your last name"/> </td>
       </tr>
        <tr>
            <td> City Name  </td>
            <td> 
                <select>
                    <option> Texas </option>
                    <option> WDC </option>
                    <option> Las Vegas </option>
                    <option> New York </option>
                    <option> Florida </option>
                </select>
         </td>

         <tr>
            <td> Gender </td>
            <td>
                <input type="radio"/>Male  <br/>
                <input type="radio"/>Female  
            </td>
         </tr>

         <tr>
            <td> Vehicle/s</td>
            <td>
                <input type="checkbox"/>2 Wheeler  <br/>              
                <input type="checkbox"/>4 Wheeler   <br/>              
                <input type="checkbox"/>6 Wheeler     <br/>           
                <input type="checkbox"/>8 Wheeler  <br/>
            </td>
         </tr>

         <tr>
            <td> Age </td>
            <td> <input type="number" min="18" max="60"/> </td>
         </tr>

         <tr>
            <td> Email </td>
            <td> <input type="email" placeholder="Enter Email"/> </td>
         </tr>


    </table>
    </form>
</body>
</html>
